<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>NAIJART — Arte nigeriano en Europa</title>

  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Favicon (lo generamos en el punto 5) -->

  <!-- Fuentes (ya las tenías de cuando montamos las variables) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

  <!-- Open Graph: cómo se ve el link al compartirlo en redes (WhatsApp, Facebook, LinkedIn...) -->

  <meta property="og:description" content="Asociación de artistas nigerianos creada para promocionar su arte en Europa.">
  <meta property="og:image" content="og-image.jpg">
  <meta property="og:type" content="website">

  <!-- Twitter/X card (mismo propósito que Open Graph, pero para X) -->
  <meta name="twitter:card" content="summary_large_image">
</head>

</html>
