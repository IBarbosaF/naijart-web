<header class="header" [class.header--scrolled]="isScrolled()">
  <div class="header__inner">
    <a routerLink="/" class="header__logo" (click)="closeMenu()">
      <span class="header__logo-text">NAIJART</span>
    </a>

    <nav class="header__nav" [attr.aria-label]="'common.mainNav' | translate">
      @for (link of navLinks; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="header__link--active"
          class="header__link"
        >{{ link.key | translate }}</a>
      }
    </nav>

    <div class="header__actions">
      <div class="header__lang" role="group" [attr.aria-label]="'common.langSelector' | translate">
        @for (lang of languages; track lang) {
          <button
            type="button"
            class="header__lang-btn"
            [class.header__lang-btn--active]="currentLang() === lang"
            (click)="setLang(lang)"
          >{{ lang | uppercase }}</button>
        }
      </div>

      <a routerLink="/login" class="btn btn--ghost btn--sm header__login">{{ 'common.login' | translate }}</a>

      <button
        type="button"
        class="header__burger"
        [class.header__burger--open]="isMenuOpen()"
        (click)="toggleMenu()"
        [attr.aria-expanded]="isMenuOpen()"
        aria-controls="mobile-menu"
        [attr.aria-label]="'common.openMenu' | translate"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </div>

  <div class="header__mobile" id="mobile-menu" [class.header__mobile--open]="isMenuOpen()">
    <nav class="header__mobile-nav" [attr.aria-label]="'common.mobileNav' | translate">
      @for (link of navLinks; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="header__mobile-link--active"
          class="header__mobile-link"
          (click)="closeMenu()"
        >{{ link.key | translate }}</a>
      }
    </nav>

    <div class="header__mobile-footer">
      <div class="header__lang header__lang--mobile" role="group" [attr.aria-label]="'common.langSelector' | translate">
        @for (lang of languages; track lang) {
          <button
            type="button"
            class="header__lang-btn"
            [class.header__lang-btn--active]="currentLang() === lang"
            (click)="setLang(lang)"
          >{{ lang | uppercase }}</button>
        }
      </div>

      <a routerLink="/login" class="btn btn--ghost btn--sm" (click)="closeMenu()">{{ 'common.login' | translate }}</a>
    </div>
  </div>
</header>
